<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1236" cy="693" r="59" fill="#f57c00" opacity="0.07"/>
    <circle cx="173" cy="311" r="63" fill="#f57c00" opacity="0.17"/>
    <circle cx="408" cy="588" r="73" fill="#f57c00" opacity="0.19"/>
    <circle cx="708" cy="309" r="68" fill="#f57c00" opacity="0.13"/>
    <circle cx="460" cy="96" r="55" fill="#f57c00" opacity="0.20"/>
    <circle cx="1138" cy="627" r="38" fill="#f57c00" opacity="0.07"/>
    <rect x="776" y="558" width="22" height="87" rx="8" fill="#e65100" opacity="0.14" transform="rotate(32, 48, 443)"/>
    <rect x="-14" y="560" width="54" height="65" rx="8" fill="#e65100" opacity="0.14" transform="rotate(44, 884, 28)"/>
    <rect x="350" y="377" width="99" height="86" rx="8" fill="#e65100" opacity="0.13" transform="rotate(30, 143, 585)"/>
    <rect x="1004" y="-53" width="99" height="93" rx="8" fill="#e65100" opacity="0.14" transform="rotate(41, 1067, -59)"/>
    <rect x="749" y="88" width="66" height="34" rx="8" fill="#e65100" opacity="0.10" transform="rotate(26, 460, 318)"/>
    <rect x="128" y="92" width="57" height="82" rx="8" fill="#e65100" opacity="0.04" transform="rotate(30, 283, 695)"/>
    <rect x="1285" y="96" width="82" height="73" rx="8" fill="#e65100" opacity="0.14" transform="rotate(18, 145, 461)"/>
    <rect x="369" y="482" width="43" height="21" rx="8" fill="#e65100" opacity="0.04" transform="rotate(10, 1063, 32)"/>
    <polygon points="1251,270 1326,420 1176,420" fill="#f57c00" opacity="0.08"/>
    <polygon points="1094,625 1139,715 1049,715" fill="#f57c00" opacity="0.04"/>
    <polygon points="730,518 811,680 649,680" fill="#f57c00" opacity="0.07"/>
    <polygon points="866,344 945,502 787,502" fill="#f57c00" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,580 C360,605 840,555 1200,580 L1200,630 L0,630Z" fill="#f57c00" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    발산 코인노래방 추천정보
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    발산 — 코인노래방
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#ffcc80" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#ffcc80" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    발산 발산 코인노래방 추천정보 — 코인노래방
  </text>
</svg>